<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GitCortex Studio — primary logo -->
  <defs>
    <linearGradient id="gc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gc-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gc-branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#gc-bg)"/>

  <!-- Neural "cortex" nodes + synapses -->
  <g stroke="url(#gc-accent)" stroke-width="6" opacity="0.85" fill="none">
    <line x1="160" y1="150" x2="256" y2="120"/>
    <line x1="256" y1="120" x2="352" y2="150"/>
    <line x1="160" y1="150" x2="256" y2="256"/>
    <line x1="352" y1="150" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="160" y2="362"/>
    <line x1="256" y1="256" x2="352" y2="362"/>
    <line x1="160" y1="362" x2="256" y2="392"/>
    <line x1="352" y1="362" x2="256" y2="392"/>
  </g>
  <g fill="url(#gc-accent)">
    <circle cx="256" cy="120" r="18"/>
    <circle cx="160" cy="150" r="14"/>
    <circle cx="352" cy="150" r="14"/>
    <circle cx="256" cy="256" r="20"/>
    <circle cx="160" cy="362" r="14"/>
    <circle cx="352" cy="362" r="14"/>
    <circle cx="256" cy="392" r="18"/>
  </g>

  <!-- Git branch motif (cortex as "git" graph) -->
  <g stroke="url(#gc-branch)" stroke-width="7" fill="none" opacity="0.0">
  </g>

  <!-- Wordmark -->
  <g fill="#e2e8f0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="256" y="470" font-size="58" font-weight="700" letter-spacing="2">GitCortex</text>
  </g>
</svg>
